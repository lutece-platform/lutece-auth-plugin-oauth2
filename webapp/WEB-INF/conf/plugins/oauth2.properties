################################################################################
# Fichier de configuration du plugin Oauth2




# ClientConf

oauth2.client.clientId=<id>
oauth2.client.clientSecret=<secret>
oauth2.client.public=false
oauth2.client.pkce=false
# By default the redirect Url is the Oauth2 Servlet URL servlet/plugins/oauth2/callback
oauth2.client.redirectUri=
# By default the postLogoutRedirectUri is the Lutece home page http://localhost:8080/lutece
oauth2.client.postLogoutRedirectUri=


# AuthServerConf type OIDC
oauth2.oIDCServer.issuer=

# AuthServerConf
oauth2.server.issuer=
oauth2.server.authorizationEndpointUri=
oauth2.server.tokenEndpointUri=
oauth2.server.logoutEndpointUri=
oauth2.server.enableJwtParser=false
oauth2.server.iDTokenSignatureAlgorithmNames=HS512
#oauth2.server.iDTokenSignatureAlgorithmNames=HS512,RS256,RS512,ES256,ES512
oauth2.server.jwksEndpointUri=


#oauth2.callbackHandler

oauth2.callbackHandler.jwtParser=oauth2.jjwtJWTParser
#oauth2.callbackHandler.jwtParser=oauth2.mitreJWTParser
oauth2.callbackHandler.default=true
oauth2.callbackHandler.server=oauth2.oIDCServer
#oauth2.callbackHandler.server=oauth2.server

# DataClient Configuration - LogUserInfoDataClient
oauth2.dataclient.logUserInfo.dataServerUri=https://fcp.integ01.dev-oauth2.fr/api/v1/userinfo
oauth2.dataclient.logUserInfo.tokenMethod=HEADER
oauth2.dataclient.logUserInfo.scopes=openid,profile,email,address,phone
# Optional eIDAS management
#oauth2.dataclient.logUserInfo.acrValues=eidas2

#Redirect page after handle error
oauth2.error.page=jsp/site/Portal.jsp?page=oauth2HandleError&view=error

# JWT Parser Implementation (possible values: jjwt, mitre)
oauth2.jwtParser=jjwt