################################################################################
# Fichier de configuration du plugin Oauth2

# --- Server configuration : OpenID Connect discovery (bean oauth2.server / OIDCAuthServerConf)
# FranceConnect v2 sandbox (bac à sable). Production : https://oidc.franceconnect.gouv.fr/api/v2
oauth2.issuer=https://fcp-low.sbx.dev-franceconnect.fr/api/v2

# --- Server configuration : direct endpoints (bean oauth2.server / AuthServerConf, disabled in oauth2_context.xml)
# Uncomment these keys when switching oauth2.server to AuthServerConf
#oauth2.server.issuer=
#oauth2.server.authorizationEndpointUri=
#oauth2.server.tokenEndpointUri=
#oauth2.server.logoutEndpointUri=
# If set, signature keys are downloaded from this JWKS endpoint ; otherwise the client secret is used (HMAC)
#oauth2.server.jwksEndpointUri=
#oauth2.server.enableJwtParser=true
# Comma separated list of accepted alg values. Leave empty if ID tokens are not signed.
#oauth2.server.iDTokenSignatureAlgorithmNames=HS512

# --- Client configuration (bean oauth2.client / AuthClientConf)
# client id can be set here or taken from the tomcat context, see https://tomcat.apache.org/tomcat-9.0-doc/config/context.html#Environment_Entries
oauth2.clientId=<id>
# client secret can be set here or taken from the tomcat context, see https://tomcat.apache.org/tomcat-9.0-doc/config/context.html#Environment_Entries
oauth2.clientSecret=<secret>
# public client : the client secret is not sent to the token endpoint
oauth2.client.public=false
# PKCE (S256 code challenge)
oauth2.client.pkce=false
# Redirect URI registered at the OAuth2 server. Leave empty to use the callback servlet URL (<base url>/servlet/plugins/oauth2/callback)
oauth2.client.redirectUri=
# Redirect URI after logout. Leave empty to use the Lutece base URL
oauth2.client.postLogoutRedirectUri=

# --- Callback handler (bean oauth2.callbackHandler)
oauth2.callbackHandler.default=true

# --- Sample DataClient LogUserInfo (bean oauth2.logUserInfoDataClient, disabled in oauth2_context.xml)
#oauth2.dataclient.logUserInfo.dataServerUri=https://fcp-low.sbx.dev-franceconnect.fr/api/v2/userinfo
#oauth2.dataclient.logUserInfo.tokenMethod=HEADER
#oauth2.dataclient.logUserInfo.scopes=openid,profile,email
# Optional eIDAS management
#oauth2.dataclient.logUserInfo.acrValues=eidas1

# --- Redirect page after handle error
oauth2.error.page=jsp/site/Portal.jsp?page=oauth2HandleError&view=error