<@cTpl>
<@cContainer>
	<@cTitle level=1>#i18n{oauth2.handleError.title}</@cTitle>
	<#if error?has_content>
	<p>#i18n{oauth2.handleError.labelError} <strong>${error}</strong></p>
	<#else>
	<p>#i18n{oauth2.handleError.labelErrorUnknown}</p>
	</#if>
	<p>#i18n{oauth2.handleError.labelApology}</p>
</@cContainer>
</@cTpl>
