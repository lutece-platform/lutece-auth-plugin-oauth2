# OAuth2 Server Configuration
# The issuer value should be configured based on your OAuth2 provider
oauth2.issuer=${oauth2.issuer}

# OAuth2 Client Configuration
oauth2.clientId=${oauth2.clientId}
oauth2.clientSecret=${oauth2.clientSecret}
oauth2.client.public=false
oauth2.client.pkce=false

# DataClient Configuration - LogUserInfoDataClient
oauth2.dataclient.logUserInfo.name=logUserInfo
oauth2.dataclient.logUserInfo.dataServerUri=https://fcp.integ01.dev-oauth2.fr/api/v1/userinfo
oauth2.dataclient.logUserInfo.tokenMethod=HEADER
oauth2.dataclient.logUserInfo.scopes=openid,profile,email,address,phone
